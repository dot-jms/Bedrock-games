<!DOCTYPE html>
<html lang="en-US">
<head>
  <script src="gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bedrock Games</title>
  <link rel="icon" href="bedrockgamesfavicon.png">
  <link rel="stylesheet" href="css/library.css">
</head>
<body>
<section id="player" aria-label="Game player">
  <div class="p-bar">
    <button class="pbtn go" id="p-back" type="button">Close</button>
    <div class="title" id="p-title"></div>
    <button class="pbtn" id="p-compat" type="button" hidden>Safe mode</button>
    <button class="pbtn" id="p-reload" type="button">Reload</button>
    <button class="pbtn" id="p-full" type="button">Fullscreen</button>
  </div>
  <div class="p-stage" id="p-stage">
    <div class="p-load" id="p-load"><div class="spinner"></div><div id="p-hint">Loading…</div></div>
  </div>
</section>
<script src="js/player.js"></script>
</body>
</html>
