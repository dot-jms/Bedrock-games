<!DOCTYPE html>
<html lang="en-US">
<head>
  <script src="gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bedrock Games</title>
  <link rel="icon" href="bedrockgamesfavicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/library.css">
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="wrap">
  <main class="card">
    <header class="hdr">
      <div class="logo"><img src="bedrockgamesfavicon.png" alt=""></div>
      <div>
        <h1>Bedrock Games</h1>
        <div class="muted" id="count">Loading games…</div>
      </div>
    </header>

    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Search games</span>
      <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>

    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div class="letters" id="letters" aria-label="Jump to letter"></div>
    <p class="status" id="status" role="status"></p>

    <div class="grid" id="grid"></div>
    <div id="more"></div>

    <footer class="foot">
      Many games come from the Ultimate Game Stash. All games belong to their respective owners.
      Games load from third-party hosts, so if one stays blank your network may be blocking it.
    </footer>
  </main>
</div>

<section id="player" hidden aria-label="Game player">
  <div class="p-bar">
    <button class="pbtn go" id="p-back" type="button">← Back</button>
    <div class="title" id="p-title"></div>
    <button class="pbtn" id="p-compat" type="button" hidden title="Run without the safety sandbox. Use only if the game won't start or won't save.">Compatibility mode</button>
    <button class="pbtn" id="p-reload" type="button">Reload</button>
    <button class="pbtn" id="p-full" type="button">Fullscreen</button>
  </div>
  <div class="p-stage" id="p-stage">
    <div class="p-load" id="p-load"><div class="spinner"></div><div id="p-hint">Loading…</div></div>
  </div>
</section>

<script src="js/space.js"></script>
<script src="js/library.js"></script>
</body>
</html>
