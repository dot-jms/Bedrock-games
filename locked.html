<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locked</title>
<link rel="icon" href="bedrockgamesfavicon.png">
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(60% 60% at 20% 15%,rgba(150,85,255,.22),transparent 70%),#04040a;color:#f1f5f9;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
  main{width:min(440px,100%);padding:40px 34px;text-align:center;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 90px rgba(0,0,0,.65)}
  h1{margin:0 0 10px;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff,#8ef6c1 50%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0 0 26px;color:#a3aab8;line-height:1.5}
  a{display:inline-block;padding:15px 30px;border-radius:14px;background:linear-gradient(135deg,#8ef6c1,#6ee7b7);color:#071018;font-weight:800;text-decoration:none}
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <h1>Locked</h1>
  <p>Bedrock Games only opens from Bedrock. Open Bedrock, sign in, and launch it from the Games tab.</p>
  <a href="https://dot-jms.github.io/Bedrock/">Go to Bedrock</a>
</main>
</body>
</html>
